- description: "single assigned task with relative deadline resolves to ISO"
  vars:
    today: "2026-09-08"
    text: |
      ok mine - im still on the mpesa callback thing, ann said she needs it by fri
      so ill push it today or tmr. nothing else from me
  assert:
    - type: javascript
      value: |
        const { tasks } = JSON.parse(output);
        if (tasks.length !== 1) return { pass: false, score: 0, reason: `expected 1 task, got ${tasks.length}` };
        const t = tasks[0];
        // 2026-09-08 is a Tuesday, so "fri" is the 11th.
        if (t.dueDate !== "2026-09-11") return { pass: false, score: 0, reason: `dueDate ${t.dueDate}, expected 2026-09-11` };
        if (t.deadline === null) return { pass: false, score: 0, reason: "raw deadline wording was dropped" };
        if (t.status !== "assigned") return { pass: false, score: 0, reason: `status ${t.status}, expected assigned` };
        return true;

- description: "HARD NEGATIVE — chatter containing no task at all"
  vars:
    today: "2026-09-08"
    text: |
      morning all. power was out in kikuyu till like 6am so i missed the earlier
      call. saw the demo recording though, looked good. thats all from me
  assert:
    - type: javascript
      value: |
        const { tasks, decisions } = JSON.parse(output);
        if (tasks.length !== 0) {
          return { pass: false, score: 0, reason: `hallucinated ${tasks.length} task(s): ${tasks.map(t => t.title).join(" | ")}` };
        }
        if (decisions.length !== 0) return { pass: false, score: 0, reason: `hallucinated ${decisions.length} decision(s)` };
        return true;

- description: "blocker ownership — external dependency is not ours"
  vars:
    today: "2026-09-08"
    text: |
      blocked on my side. waiting for safaricom to whitelist our shortcode,
      raised the ticket friday, no reply yet. cant test till they come back
  assert:
    - type: javascript
      value: |
        const { tasks } = JSON.parse(output);
        const t = tasks[0];
        if (!t) return { pass: false, score: 0, reason: "no task extracted" };
        if (t.status !== "blocked") return { pass: false, score: 0, reason: `status ${t.status}, expected blocked` };
        if (t.blockerOwnedByUs !== false) return { pass: false, score: 0, reason: `blockerOwnedByUs ${t.blockerOwnedByUs}, expected false` };
        return true;
    - type: llm-rubric
      value: |
        The blockerDescription field must say that the team is waiting on Safaricom
        to whitelist the shortcode. Answer PASS if it states that. Answer FAIL if it
        omits Safaricom, omits the whitelisting, or describes a different blocker.
        Length, wording and style are irrelevant — do not reward detail.

